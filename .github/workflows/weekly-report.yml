name: Rapport hebdo analytics

on:
  schedule:
    # Lundi 7h17 UTC = 9h17 Paris en été, 8h17 en hiver. Minute décalée : GitHub
    # déclenche les crons de l'heure pile avec parfois plusieurs heures de retard.
    - cron: '17 7 * * 1'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Envoyer le rapport
        run: node scripts/weekly-report/index.ts
        env:
          UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
